<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antithrombotic timing — ESAIC/ESRA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3A8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Antithrombotic">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Peri-operative antithrombotic interruption and resumption intervals: ESAIC/ESRA 2022 (regional anaesthesia) and ESAIC 2023 (surgical bleeding).">
<style>
/* ============================================================
   THEME — change colours here
   ============================================================ */
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --soft:#F3F5F9; --ink:#111827; --muted:#4B5563; --line:#D9DEE7;
  --blue:#1E3A8A; --blue-soft:#E8EDF8; --amber:#9A6A0F; --amber-soft:#FBF1D8;
  --red:#A8281F; --ok:#2E6B3A; --radius:14px; --w:1040px; --tap:46px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:inherit}
html{scroll-padding-top:calc(var(--sat) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* sticky top: title + search + chips */
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 14px 10px}
.top .in{max-width:var(--w);margin:0 auto}
.titlerow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.titlerow h1{font-size:1.15rem;margin:0;flex:1;letter-spacing:-.01em}
.titlerow .src{font-size:.78rem;color:var(--muted);white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:var(--tap)}
.search svg{flex:none;width:20px;height:20px;color:var(--muted)}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--ink);min-width:0;height:100%}
.search input:focus{outline:none}
.search button{border:0;background:none;color:var(--muted);padding:6px;display:none}
.search.has button{display:block}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips .lbl{flex:none;align-self:center;font-size:.82rem;color:var(--muted);padding-right:2px}
.chips button{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:.92rem;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chips .sep{flex:none;width:1px;background:var(--line);margin:4px 4px}

/* tabs: top on desktop, bottom bar on phone */
.tabs{display:flex;gap:4px;max-width:var(--w);margin:0 auto;border-bottom:2px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 6px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.9rem}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
@media (max-width:720px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);border-bottom:0;padding:6px 6px calc(var(--sab) + 6px);margin:0}
  .tabs button{border-bottom:0;margin:0;border-radius:10px;padding:6px 4px;font-size:.78rem}
  .tabs button[aria-selected="true"]{background:var(--blue-soft)}
  body{padding-bottom:calc(var(--sab) + 78px)}
}

.wrap{max-width:var(--w);margin:0 auto;padding:14px 14px 40px}

.rules{background:var(--blue-soft);border-radius:var(--radius);margin:0 0 14px;overflow:hidden}
.rules summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:8px;min-height:var(--tap)}
.rules summary::-webkit-details-marker{display:none}
.rules summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:rotate(45deg);transition:transform .15s}
.rules[open] summary::after{transform:rotate(-135deg)}
.rules ul{margin:0;padding:0 14px 12px 30px;font-size:.92rem;color:var(--ink)}
.rules li{margin:5px 0}

.banner{font-size:.85rem;color:var(--muted);margin:0 0 14px;padding:0 2px}

.group-h{font-size:.82rem;font-weight:700;color:var(--muted);margin:18px 2px 8px}

/* drug card */
.drug{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.drug summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;min-height:62px}
.drug summary::-webkit-details-marker{display:none}
.drug .name{font-weight:700;font-size:1.02rem;grid-column:1}
.drug .agents{color:var(--muted);font-size:.84rem;grid-column:1;line-height:1.3}
.drug .quick{grid-column:2;grid-row:1/3;text-align:right;color:var(--blue);font-weight:700;font-size:1rem;line-height:1.2;max-width:46vw}
.drug .quick small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.drug .quick.red{color:var(--red)} .drug .quick.ok{color:var(--ok)}
.drug[open] summary{border-bottom:1px solid var(--line);background:var(--soft)}
.drug .body{padding:4px 14px 12px}

.dose{padding:12px 0;border-top:1px dashed var(--line)}
.dose:first-child{border-top:0}
.dose h4{margin:0 0 10px;font-size:.98rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grade{font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
.cell{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.93rem;border-left:4px solid var(--line)}
.cell.main{border-left-color:var(--blue)}
.cell .lbl{font-size:.76rem;color:var(--muted);margin-bottom:3px}
.cell .val{font-weight:700;font-size:1.02rem;color:var(--ink)}
.cell.main .val{color:var(--blue);font-size:1.1rem}
.cell .val.red{color:var(--red)} .cell .val.ok{color:var(--ok)}
.cell p{margin:0;color:var(--muted)}
.renal{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--amber-soft);border-left:4px solid var(--amber);font-size:.9rem}
.renal.active{box-shadow:0 0 0 2px var(--amber) inset}
.extra{font-size:.88rem;color:var(--muted);margin:10px 0 0}

table.ref{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--paper)}
table.ref th,table.ref td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.ref th{background:var(--soft)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
.note{font-size:.9rem;color:var(--muted);margin:0 0 12px}

footer{margin-top:30px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
footer p{margin:6px 0}
.hidden{display:none!important}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drug .body{animation:fade .18s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}}
@media print{.top,.tabs{display:none}.drug{break-inside:avoid}}
</style>
</head>
<body>

<div class="top"><div class="in">
  <div class="titlerow">
    <h1>Antithrombotic timing</h1>
    <span class="src" id="srcLabel">ESAIC/ESRA 2022</span>
  </div>
  <div class="search" id="searchBox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search drug (apixaban, enoxaparin, clopidogrel…)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button id="clear" aria-label="Clear search">✕</button>
  </div>
  <div class="chips" id="chips-regional">
    <span class="lbl">Block</span>
    <button data-k="block" data-v="high" aria-pressed="true">Neuraxial / deep</button>
    <button data-k="block" data-v="low" aria-pressed="false">Superficial</button>
    <span class="sep"></span>
    <span class="lbl">CrCl</span>
    <button data-k="renal" data-v="normal" aria-pressed="true">&gt; 50</button>
    <button data-k="renal" data-v="mod" aria-pressed="false">30–50</button>
    <button data-k="renal" data-v="severe" aria-pressed="false">&lt; 30</button>
  </div>
  <div class="chips hidden" id="chips-surgical">
    <span class="lbl">Procedure risk</span>
    <button data-k="proc" data-v="low" aria-pressed="false">Low bleeding</button>
    <button data-k="proc" data-v="high" aria-pressed="true">Intermediate / high</button>
    <span class="sep"></span>
    <span class="lbl">CrCl</span>
    <button data-k="renal" data-v="normal" aria-pressed="true">&gt; 50</button>
    <button data-k="renal" data-v="mod" aria-pressed="false">30–50</button>
    <button data-k="renal" data-v="severe" aria-pressed="false">&lt; 30</button>
  </div>
</div></div>

<nav class="tabs" role="tablist">
  <button role="tab" id="tab-regional" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M7 7l5-4 5 4M7 17l5 4 5-4"/></svg>Regional</button>
  <button role="tab" id="tab-surgical" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20 18 6l2 2L6 22H4zM14 10l-2-2 2-2 2 2"/></svg>Surgery</button>
  <button role="tab" id="tab-ref" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Doses</button>
</nav>

<main class="wrap">
  <p class="banner" id="banner"></p>
  <section id="panel-regional" role="tabpanel"></section>
  <section id="panel-surgical" role="tabpanel" class="hidden"></section>
  <section id="panel-ref" role="tabpanel" class="hidden"></section>
  <footer id="footer"></footer>
</main>

<script>
const DATA = {

  disclaimer: "Decision support only. Verify against the current guideline text and your institutional protocol, and apply individual risk–benefit assessment. Time intervals are from the published tables; they do not replace clinical judgement.",

          { label:"Ticagrelor", before:"5 days", lab:"Consider platelet function test (2C)", after:"≥ 24 h. Catheter in situ: only after removal", grade:"1C / 2C" }

  surgical: {
    general: [
      "Low-bleeding-risk procedures in the guideline: skin surgery, dental / stomatological procedures, gastric and colonic endoscopy (biopsy allowed, polypectomy not), most ophthalmological (anterior chamber / cataract) surgery.",
      "Bridging: not suggested for VKA in low, moderate or high thrombotic risk (case-by-case only in very specific high-risk patients, 2C); not recommended for DOACs (1C); LMWH bridging of antiplatelet agents not recommended (1A).",

        ] },

          { label:"Clopidogrel", before:"≥ 5 days from last intake, if clinically feasible and the patient is not at high ischaemic risk", lab:"Platelet function testing may guide timing in cardiac surgery (B)",
            after:"Resume early, within 24–72 h, same agent; no recommendation on loading dose", grade:"2B / 2C" },
          { label:"Ticagrelor", before:"≥ 5 days", lab:"Platelet transfusion ineffective if ticagrelor given within 12–24 h (C)", after:"Within 24–72 h, same agent", grade:"2B / 2C" },
          { label:"Prasugrel", before:"≥ 7 days", lab:"", after:"Within 24–72 h, same agent", grade:"2B / 2C" }
        ],
        notes:"Continue P2Y12 inhibitor ≥ 4 weeks after bare-metal stent and 3–6 months after drug-eluting stent (2A). Elective non-cardiac surgery is postponed until the full DAPT course is complete (1A). If interruption is unacceptable (high thrombotic risk), bridging with cangrelor or a short-acting GP IIb/IIIa inhibitor may be considered (2C). No NSAIDs with DAPT; coxibs are possible (1C)." },

      { group:"Vitamin K antagonists", name:"VKA", agents:"warfarin, acenocoumarol, phenprocoumon",
        doses:[
          { label:"Low-bleeding-risk procedure", before:"Do not interrupt (skin, dental, endoscopy without polypectomy, cataract)", lab:"", after:"—", grade:"1C" },
          { label:"Procedure requiring INR < 1.5", before:"3–5 days from last intake (all thrombotic-risk categories). If INR > 1.5 on the day before surgery: vitamin K 5 mg orally", lab:"INR < 1.5",
            after:"Resume within 24 h with a prophylactic-dose LMWH until target INR is reached on two consecutive measurements (1C). If unable to take oral medication: therapeutic-dose LMWH from 48–72 h once haemostasis is secured (1C)", grade:"1C",
            notes:"Bridging with LMWH/UFH is suggested against in low, moderate and high thrombotic risk; very specific high-risk patients (e.g. mechanical valve) case by case (2C)." },
          { label:"Emergency moderate/high-bleeding-risk surgery", before:"Measure INR on admission; 4-factor PCC (initial 25 IU FIX/kg at INR 4) rather than plasma (1B)", lab:"INR", after:"Bleeding with VKA: 4F-PCC 25–50 IU/kg + vitamin K 5–10 mg IV (1B); plasma 15–20 ml/kg + vitamin K if PCC unavailable (1C)", grade:"1B" }
        ] },

      { group:"Direct oral anticoagulants", name:"Direct Xa inhibitors", agents:"rivaroxaban · apixaban · edoxaban",
        doses:[
          { label:"Low-bleeding-risk procedure", before:"Can be given up to the day before surgery", lab:"", after:"Restart about 6 h after the procedure once haemostasis is achieved, without LMWH", grade:"2C" },
          { label:"Intermediate / high-bleeding-risk procedure", before:"3 days from last intake to surgery, provided CrCl > 30 ml/min. No bridging", lab:"No routine testing",
            after:"Prophylactic-dose LMWH or DOAC post-op if thromboprophylaxis is indicated, then full therapeutic dose up to 72 h post-op once surgical haemostasis is achieved", grade:"1C / 2C",
            renal:{ severe:"CrCl < 30: outside the 3-day recommendation — individualise (consider drug level / longer interval; see regional tab for assay targets)" },
            notes:"Severe bleeding on a Xa inhibitor: PCC 25 IU/kg initially, suggested over andexanet alpha (2C)." }
        ] },

      { group:"Direct oral anticoagulants", name:"Dabigatran", agents:"110–150 mg bd",
        doses:[
          { label:"Low-bleeding-risk procedure", before:"Can be given up to the day before surgery", lab:"", after:"Restart about 6 h after the procedure once haemostasis is achieved, without LMWH", grade:"2C" },
          { label:"Intermediate / high-bleeding-risk procedure", before:"3 days from last intake if CrCl > 50 ml/min. No bridging", lab:"No routine testing",
            after:"Prophylactic-dose LMWH or DOAC post-op if indicated, then full dose up to 72 h post-op once haemostasis is achieved", grade:"1C / 2C",
            renal:{ mod:"CrCl 30–50: 5 days from last intake", severe:"CrCl < 30: outside the recommendation (dabigatran generally contraindicated) — individualise" },
            notes:"Severe bleeding on dabigatran: idarucizumab could be considered (2C)." }
        ] },

      { group:"Heparins", name:"UFH / LMWH / fondaparinux", agents:"",
        doses:[
          { label:"Interruption before surgery", before:"The ESAIC 2023 bleeding guideline gives no specific pre-operative interruption interval for heparins or fondaparinux. For a practical minimum, see the pharmacokinetic intervals on the Regional anaesthesia tab (LMWH low 12 h / high 24 h; UFH IV 6 h / SC 12 h; fondaparinux 36 h) and your local protocol",
            lab:"Anti-Xa (LMWH, fondaparinux) · aPTT / anti-Xa / ACT (UFH)", after:"Per VTE-prophylaxis or therapeutic indication once haemostasis is secured", grade:"—",
            notes:"Reversal of severe bleeding: IV UFH — protamine 1 mg per 100 IU given in the previous 2–3 h (1A). SC UFH unresponsive — continuous protamine guided by anti-Xa/aPTT (2C). LMWH — protamine 1 mg per 100 anti-Xa IU (2C). Fondaparinux — rFVIIa off-label could be considered (2C)." }
        ] }
    ]
  },

  /* ---------- TAB 3: DOAC dose definitions (ESAIC/ESRA 2022, Table 1) ---------- */
  doseTable: {
    note:"Low vs high dose is defined by regimen, not by indication alone; ‘low’ = twice the half-life interval, ‘high’ = 4–5 half-lives. Doses from the Summary of Product Characteristics as reproduced in Table 1 of the guideline.",
    rows:[
      ["VTE prophylaxis after hip/knee replacement", "low", "10 mg od", "2.5 mg bd", "—", "220 mg od (150 mg od if CrCl 30–50, age ≥ 75, verapamil/amiodarone/quinidine)"],
      ["Stroke prevention in non-valvular AF", "high", "20 mg od (15 mg if CrCl 15–50)", "5 mg bd (2.5 mg bd if 2 of: age ≥ 80, weight ≤ 60 kg, creatinine ≥ 133 µmol/l; or CrCl 15–29)", "60 mg od (30 mg if CrCl 15–50, weight ≤ 60 kg, or ciclosporin/dronedarone/erythromycin/ketoconazole)", "150 mg bd (110 mg bd if age ≥ 80 or verapamil; 110/150 bd if CrCl 30–50 or age 75–80)"],
      ["Acute VTE treatment", "high", "15 mg bd × 21 d then 20 mg od (15 mg od if CrCl 15–50)", "10 mg bd × 7 d then 5 mg bd", "60 mg od (30 mg as above)", "150 mg bd (110 mg bd as above)"],
      ["Extended prevention of recurrent VTE", "low", "10 mg od or 20 mg od", "2.5 mg bd", "—", "—"],
      ["Acute coronary syndrome", "low", "2.5 mg bd", "—", "—", "—"],

/* ============================================================
   APP
   ============================================================ */
const state = { tab:"regional", block:"high", proc:"high", renal:"normal", q:"" };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&(?!\w+;)/g,"&amp;").replace(/</g,"&lt;");

function cell(label, val, cls, main){
  const inner = val ? `<div class="val ${cls||""}">${val}</div>` : `<p>—</p>`;
  return `<div class="cell ${main?"main":""}"><div class="lbl">${label}</div>${inner}</div>`;
}
function renalBox(r){
  if(!r) return "";
  return ["mod","severe"].filter(k=>r[k]).map(k=>`<div class="renal ${state.renal===k?"active":""}">${r[k]}</div>`).join("");
}
function doseRow(d, flag){
  return `<div class="dose">
    <h4>${esc(d.label)} ${d.grade?`<span class="grade">${esc(d.grade)}</span>`:""}</h4>
    <div class="cols">
      ${cell("Last dose → procedure", d.before, flag, true)}
      ${cell("Procedure → next dose", d.after)}
      ${cell("Lab target", d.lab)}
    </div>
    ${renalBox(d.renal)}
    ${d.notes?`<p class="extra">${d.notes}</p>`:""}
  </div>`;
}
function matches(drug){
  if(!state.q) return true;
  return (drug.name+" "+drug.agents+" "+drug.group).toLowerCase().includes(state.q);
}
function rules(items, title){
  return `<details class="rules"><summary>${title}</summary><ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul></details>`;
}
function renderList(drugs, quickFn){
  const groups = [...new Set(drugs.map(d=>d.group))];
  let html = "", any = false;
  for(const g of groups){
    const items = drugs.filter(d=>d.group===g && matches(d));
    if(!items.length) continue;
    any = true;
    html += `<div class="group-h">${esc(g)}</div>`;
    for(const d of items){
      const q = quickFn(d);
      html += `<details class="drug" ${state.q?"open":""}>
        <summary>
          <span class="name">${esc(d.name)}</span>
          <span class="agents">${esc(d.agents)}</span>
          <span class="quick ${d.flag||""}">${q.v}<small>${q.l}</small></span>
        </summary>
        <div class="body">${d.doses.map(x=>doseRow(x, d.flag)).join("")}${d.notes?`<p class="extra">${d.notes}</p>`:""}</div>
      </details>`;
    }
  }
  return any ? html : `<p class="empty">No drug matches “${esc(state.q)}”.<br>Try the generic name.</p>`;
}
function short(v){ v = v.replace(/\s*\(.*?\)/g,""); const cut = v.split(/[—·,.;]/)[0].trim(); return cut.length>34 ? cut.slice(0,32)+"…" : cut; }
function quick(d, row){
  let v = row.before, l = "last dose → procedure";
  if(state.renal!=="normal" && row.renal && row.renal[state.renal]){ v = row.renal[state.renal]; l = "CrCl-adjusted"; }
  return { v: short(v), l };
}
function quickRegional(d){ return quick(d, d.doses[0]); }
function quickSurgical(d){
  const want = state.proc==="low" ? /low-bleeding/i : /intermediate|withdrawal is decided|INR < 1\.5|clopidogrel|interruption before/i;
  return quick(d, d.doses.find(x=>want.test(x.label)) || d.doses[0]);
}

function render(){
  for(const t of ["regional","surgical","ref"]){
    $(`#tab-${t}`).setAttribute("aria-selected", state.tab===t);
    $(`#panel-${t}`).classList.toggle("hidden", state.tab!==t);
  }
  $("#chips-regional").classList.toggle("hidden", state.tab!=="regional");
  $("#chips-surgical").classList.toggle("hidden", state.tab!=="surgical");
  $("#searchBox").classList.toggle("hidden", state.tab==="ref");
  $("#srcLabel").textContent = state.tab==="surgical" ? "ESAIC 2023" : state.tab==="ref" ? "ESAIC/ESRA 2022 · Table 1" : "ESAIC/ESRA 2022";
  $("#banner").textContent = DATA.disclaimer;
  document.querySelectorAll('.chips button[data-k="renal"]').forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===state.renal));

  if(state.tab==="regional"){
    const R = DATA.regional;
    if(state.block==="high"){
      $("#panel-regional").innerHTML = rules(R.generalHigh, "Key rules for neuraxial & deep blocks") + renderList(R.drugs, quickRegional);
    } else {
      $("#panel-regional").innerHTML = rules(R.generalLow, "Key rules for superficial blocks") +
        `<div class="scroll"><table class="ref">
           <tr><th>Drug</th><th>Last dose → block</th><th>Block → next dose</th><th>Lab target</th></tr>
           <tr><td>DOACs (any dose), LMWH low, UFH low, fondaparinux low, aspirin low</td><td><strong style="color:var(--ok)">Zero</strong></td><td>Routinely prescribed next time point</td><td>No testing (consider a level if accumulation suspected)</td></tr>
           <tr><td>VKA, LMWH high, UFH high, aspirin high, P2Y12 inhibitors, drug combinations</td><td><strong style="color:var(--ok)">Zero</strong> if within or below the patient's individual therapeutic range</td><td>Routinely prescribed next time point</td><td>Within or below the individual therapeutic range (not defined for DOACs)</td></tr>
         </table></div>`;
    }
  }
  if(state.tab==="surgical"){
    const S = DATA.surgical;
    $("#panel-surgical").innerHTML = rules(S.general, "Key rules for surgical interruption") +
      `<p class="note">Card summary shows the ${state.proc==="low"?"low":"intermediate / high"} bleeding-risk row. Open a drug for every scenario.</p>` +
      renderList(S.drugs, quickSurgical);
  }
  if(state.tab==="ref"){
    const T = DATA.doseTable;
    $("#panel-ref").innerHTML =
      `<p class="note">${T.note}</p>
       <div class="scroll"><table class="ref">
         <tr><th>Indication</th><th>Category</th><th>Rivaroxaban</th><th>Apixaban</th><th>Edoxaban</th><th>Dabigatran</th></tr>
         ${T.rows.map(r=>`<tr><td>${r[0]}</td><td><strong>${r[1]}</strong></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join("")}
       </table></div>
       <h3 style="margin-top:24px;font-size:1rem">Other dose thresholds</h3>
       <ul class="note">
         <li>LMWH: low ≤ 50 IU anti-Xa/kg/day (enoxaparin 40 mg, dalteparin 5000 IU, nadroparin 5700 IU, tinzaparin 4500 IU per day); high = above.</li>
         <li>UFH: low ≤ 200 IU/kg/day SC or ≤ 100 IU/kg/day IV; high = above.</li>
         <li>Fondaparinux: low 2.5 mg/day; high 5–10 mg/day.</li>
         <li>Aspirin: low &lt; 200 mg/day; high ≥ 200 mg/day.</li>
       </ul>`;
  }
  $("#footer").innerHTML = `<p><strong>Sources</strong></p>` +
    DATA.sources.map(s=>`<p>${esc(s.key)} — ${esc(s.text)} <a href="${s.url}" target="_blank" rel="noopener">link</a></p>`).join("") +
    `<p>Data version ${esc(DATA.version)} · ${esc(DATA.editor)}</p>`;
}

document.querySelectorAll(".chips").forEach(c=>c.addEventListener("click", e=>{
  const b = e.target.closest("button[data-k]"); if(!b) return;
  state[b.dataset.k] = b.dataset.v;
  c.querySelectorAll(`button[data-k="${b.dataset.k}"]`).forEach(x=>x.setAttribute("aria-pressed", x===b));
  render();
}));
document.querySelectorAll('[role="tab"]').forEach(t=>t.addEventListener("click",()=>{ state.tab = t.id.replace("tab-",""); render(); window.scrollTo({top:0}); }));
const qi = $("#q");
qi.addEventListener("input", e=>{ state.q = e.target.value.trim().toLowerCase(); $("#searchBox").classList.toggle("has", !!state.q); render(); });
$("#clear").addEventListener("click", ()=>{ qi.value=""; state.q=""; $("#searchBox").classList.remove("has"); render(); qi.focus(); });
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
</html>
