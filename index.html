<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antithrombotic timing — ESAIC/ESRA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3A8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Antithrombotic">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Peri-operative antithrombotic interruption and resumption intervals: ESAIC/ESRA 2022 (regional anaesthesia) and ESAIC 2023 (surgical bleeding).">
<style>
/* ============================================================
   THEME — change colours here
   ============================================================ */
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --soft:#F3F5F9; --ink:#111827; --muted:#4B5563; --line:#D9DEE7;
  --blue:#1E3A8A; --blue-soft:#E8EDF8; --amber:#9A6A0F; --amber-soft:#FBF1D8;
  --red:#A8281F; --ok:#2E6B3A; --radius:14px; --w:1040px; --tap:46px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:inherit}
html{scroll-padding-top:calc(var(--sat) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* sticky top: title + search + chips */
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 14px 10px}
.top .in{max-width:var(--w);margin:0 auto}
.titlerow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.titlerow h1{font-size:1.15rem;margin:0;flex:1;letter-spacing:-.01em}
.titlerow .src{font-size:.78rem;color:var(--muted);white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:var(--tap)}
.search svg{flex:none;width:20px;height:20px;color:var(--muted)}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--ink);min-width:0;height:100%}
.search input:focus{outline:none}
.search button{border:0;background:none;color:var(--muted);padding:6px;display:none}
.search.has button{display:block}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips .lbl{flex:none;align-self:center;font-size:.82rem;color:var(--muted);padding-right:2px}
.chips button{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:.92rem;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chips .sep{flex:none;width:1px;background:var(--line);margin:4px 4px}

/* tabs: top on desktop, bottom bar on phone */
.tabs{display:flex;gap:4px;max-width:var(--w);margin:0 auto;border-bottom:2px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 6px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.9rem}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
@media (max-width:720px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);border-bottom:0;padding:6px 6px calc(var(--sab) + 6px);margin:0}
  .tabs button{border-bottom:0;margin:0;border-radius:10px;padding:6px 4px;font-size:.78rem}
  .tabs button[aria-selected="true"]{background:var(--blue-soft)}
  body{padding-bottom:calc(var(--sab) + 78px)}
}

.wrap{max-width:var(--w);margin:0 auto;padding:14px 14px 40px}

.rules{background:var(--blue-soft);border-radius:var(--radius);margin:0 0 14px;overflow:hidden}
.rules summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:8px;min-height:var(--tap)}
.rules summary::-webkit-details-marker{display:none}
.rules summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:rotate(45deg);transition:transform .15s}
.rules[open] summary::after{transform:rotate(-135deg)}
.rules ul{margin:0;padding:0 14px 12px 30px;font-size:.92rem;color:var(--ink)}
.rules li{margin:5px 0}

.banner{font-size:.85rem;color:var(--muted);margin:0 0 14px;padding:0 2px}

.group-h{font-size:.82rem;font-weight:700;color:var(--muted);margin:18px 2px 8px}

/* drug card */
.drug{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.drug summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;min-height:62px}
.drug summary::-webkit-details-marker{display:none}
.drug .name{font-weight:700;font-size:1.02rem;grid-column:1}
.drug .agents{color:var(--muted);font-size:.84rem;grid-column:1;line-height:1.3}
.drug .quick{grid-column:2;grid-row:1/3;text-align:right;color:var(--blue);font-weight:700;font-size:1rem;line-height:1.2;max-width:46vw}
.drug .quick small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.drug .quick.red{color:var(--red)} .drug .quick.ok{color:var(--ok)}
.drug[open] summary{border-bottom:1px solid var(--line);background:var(--soft)}
.drug .body{padding:4px 14px 12px}

.dose{padding:12px 0;border-top:1px dashed var(--line)}
.dose:first-child{border-top:0}
.dose h4{margin:0 0 10px;font-size:.98rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grade{font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
.cell{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.93rem;border-left:4px solid var(--line)}
.cell.main{border-left-color:var(--blue)}
.cell .lbl{font-size:.76rem;color:var(--muted);margin-bottom:3px}
.cell .val{font-weight:700;font-size:1.02rem;color:var(--ink)}
.cell.main .val{color:var(--blue);font-size:1.1rem}
.cell .val.red{color:var(--red)} .cell .val.ok{color:var(--ok)}
.cell p{margin:0;color:var(--muted)}
.renal{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--amber-soft);border-left:4px solid var(--amber);font-size:.9rem}
.renal.active{box-shadow:0 0 0 2px var(--amber) inset}
.extra{font-size:.88rem;color:var(--muted);margin:10px 0 0}

table.ref{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--paper)}
table.ref th,table.ref td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.ref th{background:var(--soft)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
.note{font-size:.9rem;color:var(--muted);margin:0 0 12px}

footer{margin-top:30px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
footer p{margin:6px 0}
.hidden{display:none!important}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drug .body{animation:fade .18s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}}
@media print{.top,.tabs{display:none}.drug{break-inside:avoid}}

.brands{color:var(--blue);font-weight:500}
.picker{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.picker label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.picker select{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);min-height:var(--tap)}
.picker small{display:block;color:var(--muted);font-size:.78rem;margin-top:6px}
.plan-form{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.fl{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 0}
.fl input{display:block;width:100%;margin-top:6px;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);min-height:var(--tap)}
.drugchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.drugchips button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 12px;font-size:.88rem;text-align:left}
.drugchips button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.plan-out{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-bottom:12px}
@media (max-width:720px){.plan-out{grid-template-columns:1fr}}
.po{background:var(--blue-soft);border-radius:12px;padding:12px 14px}
.po.mid{background:var(--soft)}
.po .lbl{font-size:.78rem;color:var(--muted)}
.po .big{font-weight:700;font-size:1.15rem;color:var(--blue);margin:2px 0}
.po small{color:var(--muted);font-size:.8rem}
.warn{background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:10px;padding:8px 12px;margin:12px 0;font-size:.9rem}
.warn p{margin:4px 0}
.btn{margin-top:8px;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;min-height:var(--tap)}
#updBar{display:none;position:fixed;left:12px;right:12px;bottom:calc(var(--sab) + 84px);z-index:9;background:var(--blue);color:#fff;border-radius:14px;padding:10px 12px 10px 16px;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-weight:600}
#updBar.on{display:flex}
#updBar span{flex:1}
#updBar button{background:#fff;color:var(--blue);border:0;border-radius:10px;padding:8px 14px;font-weight:700;min-height:40px}
@media (min-width:721px){#updBar{bottom:16px;left:auto;right:16px;max-width:360px}}
.grade.warnb{background:var(--amber-soft);color:var(--amber)}
@media (max-width:720px){.tabs button{font-size:.72rem;padding:6px 2px}.tabs button svg{width:20px;height:20px}}
.intl{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--soft);border-left:4px solid var(--muted);font-size:.88rem}
.intl .grade{background:#E5E7EB;color:#374151;margin-right:4px}
</style>
</head>
<body>

<div class="top"><div class="in">
  <div class="titlerow">
    <h1>Antithrombotic timing</h1>
    <span class="src" id="srcLabel">ESAIC/ESRA 2022</span>
  </div>
  <div class="search" id="searchBox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search drug (apixaban, enoxaparin, clopidogrel…)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button id="clear" aria-label="Clear search">✕</button>
  </div>
  <div class="chips" id="chips-regional">
    <span class="lbl">Block</span>
    <button data-k="block" data-v="high" aria-pressed="true">Neuraxial / deep</button>
    <button data-k="block" data-v="low" aria-pressed="false">Superficial</button>
    <span class="sep"></span>
    <span class="lbl">CrCl</span>
    <button data-k="renal" data-v="normal" aria-pressed="true">&gt; 50</button>
    <button data-k="renal" data-v="mod" aria-pressed="false">30–50</button>
    <button data-k="renal" data-v="severe" aria-pressed="false">&lt; 30</button>
  </div>
  <div class="chips hidden" id="chips-surgical">
    <span class="lbl">Procedure risk</span>
    <button data-k="proc" data-v="low" aria-pressed="false">Low bleeding</button>
    <button data-k="proc" data-v="high" aria-pressed="true">Intermediate / high</button>
    <span class="sep"></span>
    <span class="lbl">CrCl</span>
    <button data-k="renal" data-v="normal" aria-pressed="true">&gt; 50</button>
    <button data-k="renal" data-v="mod" aria-pressed="false">30–50</button>
    <button data-k="renal" data-v="severe" aria-pressed="false">&lt; 30</button>
  </div>
</div></div>

<nav class="tabs" role="tablist">
  <button role="tab" id="tab-regional" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M7 7l5-4 5 4M7 17l5 4 5-4"/></svg>Regional</button>
  <button role="tab" id="tab-surgical" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20 18 6l2 2L6 22H4zM14 10l-2-2 2-2 2 2"/></svg>Surgery</button>
  <button role="tab" id="tab-other" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3h4l1 4h4l-2 4 2 4h-4l-1 4h-4l-1-4H5l2-4-2-4h4z"/></svg>Other meds</button>
  <button role="tab" id="tab-planner" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 14v4M10 16h4"/></svg>Planner</button>
  <button role="tab" id="tab-ref" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Doses</button>
</nav>

<div id="updBar" role="status"><span>Updating to the latest version…</span></div>
<main class="wrap">
  <p class="banner" id="banner"></p>
  <section id="panel-regional" role="tabpanel"></section>
  <section id="panel-surgical" role="tabpanel" class="hidden"></section>
  <section id="panel-other" role="tabpanel" class="hidden"></section>
  <section id="panel-planner" role="tabpanel" class="hidden"></section>
  <section id="panel-ref" role="tabpanel" class="hidden"></section>
  <footer id="footer"></footer>
</main>

<script>
/* ============================================================
   DATA — the only block you normally need to edit.
   hours = numeric intervals used by the Planner (null = not
   time-based, see text). brands = trade names for search.
   ============================================================ */
const DATA = {
  version: "2026-10-03f",
  editor: "Orestis Milionis, MD — 2nd Dept of Anaesthesiology, Attikon University Hospital",
  issuesUrl: "https://github.com/orestismilionis/Antithrombotics/issues",
  disclaimer: "Decision support only. Verify against the current guideline text and your institutional protocol and apply individual risk–benefit assessment. Intervals are transcribed from the published tables; they do not replace clinical judgement.",
  sources: [
    { key:"ESAIC/ESRA 2022", text:"Kietaibl S, Ferrandis R, Godier A, et al. Regional anaesthesia in patients on antithrombotic drugs: Joint ESAIC/ESRA guidelines. Eur J Anaesthesiol 2022;39:100–132. DOI 10.1097/EJA.0000000000001600 (Tables 1–4; R1–R40).",
      url:"https://esaic.org/wp-content/uploads/2023/12/regional_anaesthesia_in_patients_on_antithrom.pdf" },
    { key:"ESAIC 2023", text:"Kietaibl S, Ahmed A, Afshari A, et al. Management of severe peri-operative bleeding: Guidelines from the ESAIC, second update 2022. Eur J Anaesthesiol 2023;40:226–304. DOI 10.1097/EJA.0000000000001803 (Table 2, R2).",
      url:"https://journals.lww.com/ejanaesthesiology/fulltext/2023/04000/management_of_severe_peri_operative_bleeding_.2.aspx" },
    { key:"ESC 2022", text:"Halvorsen S, Mehilli J, Cassese S, et al. 2022 ESC Guidelines on cardiovascular assessment and management of patients undergoing non-cardiac surgery (endorsed by ESAIC). Eur Heart J 2022;43:3826–3924. DOI 10.1093/eurheartj/ehac270 (Section 5.2, Rec. Tables 12, 27, 32; Table 5).",
      url:"https://academic.oup.com/eurheartj/article/43/39/3826/6675076" },
    { key:"DGAI/DGCH/DGIM 2024", text:"Zöllner C, et al. Präoperative Evaluation erwachsener Patientinnen und Patienten vor elektiven, nicht herz-thoraxchirurgischen Eingriffen — joint recommendation of the German societies of anaesthesiology, surgery and internal medicine. Anaesthesiologie 2024;73:294–323. DOI 10.1007/s00101-024-01408-2 (Part C, E43–E54, Table 24).",
      url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC11076399/" },
    { key:"ESAIC 2018", text:"De Hert S, Staender S, Fritsch G, et al. Pre-operative evaluation of adults undergoing elective noncardiac surgery: updated guideline from the European Society of Anaesthesiology. Eur J Anaesthesiol 2018;35:407–465. DOI 10.1097/EJA.0000000000000817 (Section 2.2 concurrent medication: herbal, psychotropic drugs; beta-blockers, statins).",
      url:"https://journals.lww.com/ejanaesthesiology/fulltext/2018/06000/pre_operative_evaluation_of_adults_undergoing.3.aspx" },
    { key:"AoA/RCP/SfE 2020", text:"Woodcock T, Barker P, Daniel S, et al. Guidelines for the management of glucocorticoids during the peri-operative period for patients with adrenal insufficiency: Association of Anaesthetists, Royal College of Physicians and Society for Endocrinology UK. Anaesthesia 2020;75:654–663. DOI 10.1111/anae.14963 (Tables 1–2).",
      url:"https://associationofanaesthetists-publications.onlinelibrary.wiley.com/doi/10.1111/anae.14963" },
    { key:"ACR/AAHKS 2022", text:"Goodman SM, Springer BD, Chen AF, et al. 2022 ACR/AAHKS Guideline for the Perioperative Management of Antirheumatic Medication in Patients with Rheumatic Diseases Undergoing Elective Total Hip or Total Knee Arthroplasty. Arthritis Rheumatol 2022;74:1464–1473. DOI 10.1002/art.42140.",
      url:"https://acrjournals.onlinelibrary.wiley.com/doi/10.1002/art.42140" },
    { key:"UKCPA", text:"UK Clinical Pharmacy Association. Handbook of Perioperative Medicines (online; drug records for levothyroxine, liothyronine, carbamazepine, eslicarbazepine, valproate, co-careldopa, rotigotine, Parkinson's disease overview).",
      url:"https://periop-handbook.ukclinicalpharmacy.org/" },
    { key:"ASRA 2025", text:"Kopp SL, Vandermeulen E, McBane RD, Perlas A, Leffert L, Horlocker T. Regional anesthesia in the patient receiving antithrombotic or thrombolytic therapy: ASRA Pain Medicine Evidence-Based Guidelines (fifth edition). Reg Anesth Pain Med 2025. DOI 10.1136/rapm-2024-105766. Comparison notes in this app were taken from the ASRA guideline summary (Guideline Central), ESRA's review and ASRA's own commentary — the full text was not accessible for this build.",
      url:"https://rapm.bmj.com/lookup/doi/10.1136/rapm-2024-105766" },
    { key:"CHEST 2022", text:"Douketis JD, Spyropoulos AC, Murad MH, et al. Perioperative Management of Antithrombotic Therapy: An American College of Chest Physicians Clinical Practice Guideline. Chest 2022;162:e207–e243. DOI 10.1016/j.chest.2022.07.025 (DOAC timings follow the PAUSE protocol).",
      url:"https://journal.chestnet.org/article/S0012-3692(22)01359-3/fulltext" },
    { key:"FSRH / NICE", text:"FSRH Clinical Guideline: Combined Hormonal Contraception (2019, amended 2023); NICE NG89 Venous thromboembolism in over 16s (2018).",
      url:"https://www.fsrh.org/standards-and-guidance/documents/combined-hormonal-contraception/" }
  ],

  /* ---- Table 2 (2022): block categorisation. verify:true = column assignment unclear in the PDF text extraction — check against the printed table. ---- */
  blocks: [
    { region:"Neuraxial", items:[ ["Spinal","deep"], ["Epidural (lumbar / thoracic)","deep"] ] },
    { region:"Head & neck", items:[ ["Stellate ganglion","deep"], ["Deep cervical plexus","deep"], ["Cervical paravertebral","deep"], ["Peribulbar","deep",true], ["Occipital","superficial",true], ["Sub-Tenon's","superficial",true], ["Superficial cervical plexus","superficial"] ] },
    { region:"Upper limb", items:[ ["Infraclavicular","deep"], ["Interscalene","superficial"], ["Supraclavicular","superficial"], ["Axillary","superficial"], ["Suprascapular","superficial"], ["Ulnar / radial / median (forearm, wrist)","superficial"] ] },
    { region:"Thorax", items:[ ["Thoracic paravertebral","deep"], ["Parasternal intercostal plane (deep)","deep",true], ["Parasternal intercostal plane (superficial)","superficial",true], ["Serratus anterior plane","superficial",true], ["Erector spinae plane","superficial",true], ["Intercostal","superficial",true], ["Interpectoral / pecto-serratus (PECS)","superficial",true] ] },
    { region:"Abdomen & pelvis", items:[ ["Ilioinguinal / iliohypogastric","superficial"], ["Transversus abdominis plane (TAP)","superficial"], ["Rectus sheath","superficial"], ["Genitofemoral (genital branch)","superficial"], ["Pudendal","superficial",true] ] },
    { region:"Lower limb & back", items:[ ["Lumbar plexus / psoas compartment","deep"], ["Lumbar paravertebral","deep"], ["Lumbar sympathectomy","deep"], ["Quadratus lumborum","deep"], ["Fascia transversalis","deep"], ["Sacral plexus","deep"], ["PENG","deep"], ["Sciatic — proximal approaches (parasacral, transgluteal)","deep"], ["Femoral / femoral triangle","superficial"], ["Adductor canal","superficial"], ["Sciatic — subgluteal / popliteal","superficial"], ["Fascia iliaca","superficial"], ["Lateral cutaneous nerve of thigh","superficial"], ["Genitofemoral (femoral branch)","superficial"], ["Sural / saphenous / tibial / peroneal (ankle)","superficial"] ] }
  ],

  /* ---- Tab: regional anaesthesia (2022, Table 3 / Table 4) ---- */
  regional: {
    generalHigh: [
      "Applies to neuraxial blocks and deep (non-compressible) peripheral blocks, and equally to needle insertion, catheter insertion and catheter removal (R36).",
      "Drug combinations: use the interval of the drug with the longest interval (R19). Low-dose aspirin adds 0 h.",
      "Ultrasound guidance and bleeding-risk scores do not change the intervals (R22, R35).",
      "Bloody tap: consider a longer interval to the next dose (R39). Monitor neurology ≥ 24 h after neuraxial/deep blocks (R40).",
      "Next dose: low doses ≈ 6 h post-op (8 h − t<sub>max</sub>), high doses ≈ 24 h post-op. VKA, DOAC, high-dose LMWH and high-dose UFH should not be given with a neuraxial catheter in situ.",
      "Obstetrics: same intervals as non-pregnant (LMWH 10–12 h); deviation only after multidisciplinary risk–benefit discussion (R2, R5, R8, R11, R14)."

/* ============================================================
   APP — no need to edit unless changing behaviour
   ============================================================ */
const state = { tab:"regional", block:"high", blockName:"", proc:"high", renal:"normal", q:"",
                plan:{ mode:"regional", drugs:[], when:"", catheter:false } };
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/&(?!\w+;)/g,"&amp;").replace(/</g,"&lt;");
const RENAL_LABEL = { normal:"CrCl > 50", mod:"CrCl 30–50", severe:"CrCl < 30" };

/* ---------- shared pieces ---------- */
function cell(label, val, cls, main){
  const inner = val ? `<div class="val ${cls||""}">${val}</div>` : `<p>—</p>`;
  return `<div class="cell ${main?"main":""}"><div class="lbl">${label}</div>${inner}</div>`;
}
function renalBox(r){
  if(!r) return "";
  return ["mod","severe"].filter(k=>r[k]).map(k=>`<div class="renal ${state.renal===k?"active":""}">${r[k]}</div>`).join("");
}
function doseRow(d, flag){
  return `<div class="dose">
    <h4>${esc(d.label)} ${d.grade?`<span class="grade">${esc(d.grade)}</span>`:""}${d.verify?`<span class="grade warnb" title="Universal practice; not checked against an individual guideline record">verify</span>`:""}</h4>
    <div class="cols">
      ${cell("Last dose → procedure", d.before, flag, true)}
      ${cell("Procedure → next dose", d.after)}
      ${cell("Lab target", d.lab)}
    </div>
    ${renalBox(d.renal)}
    ${d.asra?`<div class="intl"><span class="grade">International</span> ${d.asra}</div>`:""}
    ${d.notes?`<p class="extra">${d.notes}</p>`:""}
  </div>`;
}
function hay(d){ return (d.name+" "+d.agents+" "+d.group+" "+(d.brands||"")+" "+d.doses.map(x=>x.label).join(" ")).toLowerCase(); }
function matches(d){ return !state.q || hay(d).includes(state.q); }
function rules(items, title){
  return `<details class="rules"><summary>${title}</summary><ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul></details>`;
}
function short(v){ v = v.replace(/\s*\(.*?\)/g,""); const cut = v.split(/[—·,.;]/)[0].trim(); return cut.length>34 ? cut.slice(0,32)+"…" : cut; }
function quick(row){
  let v = row.before, l = "last dose → procedure";
  if(state.renal!=="normal" && row.renal && row.renal[state.renal]){ v = row.renal[state.renal]; l = RENAL_LABEL[state.renal]+" · adjusted"; }
  return { v: short(v), l };
}
function pickSurgicalRow(d){
  const want = state.proc==="low" ? /low-bleeding/i : /intermediate|withdrawal is decided|INR < 1\.5|clopidogrel|interruption before/i;
  return d.doses.find(x=>want.test(x.label)) || d.doses[0];
}
function renderList(drugs, rowFn){
  const groups = [...new Set(drugs.map(d=>d.group))];
  let html = "", any = false;
  for(const g of groups){
    const items = drugs.filter(d=>d.group===g && matches(d));
    if(!items.length) continue;
    any = true;
    html += `<div class="group-h">${esc(g)}</div>`;
    for(const d of items){
      const q = quick(rowFn(d));
      html += `<details class="drug" ${state.q?"open":""}>
        <summary>
          <span class="name">${esc(d.name)}</span>
          <span class="agents">${esc(d.agents)}${d.brands?` <span class="brands">· ${esc(d.brands.replace(/ /g,", "))}</span>`:""}</span>
          <span class="quick ${d.flag||""}">${q.v}<small>${q.l}</small></span>
        </summary>
        <div class="body">${d.doses.map(x=>doseRow(x, d.flag)).join("")}${d.notes?`<p class="extra">${d.notes}</p>`:""}</div>
      </details>`;
    }
  }
  return any ? html : `<p class="empty">No drug matches “${esc(state.q)}”.<br>Try the generic or brand name.</p>`;
}

/* ---------- block picker (Table 2) ---------- */
function blockPicker(){
  const opts = DATA.blocks.map(r=>`<optgroup label="${esc(r.region)}">${r.items.map(([n,c,v])=>`<option value="${esc(n)}|${c}" ${state.blockName===n?"selected":""}>${esc(n)} — ${c==="deep"?"deep / neuraxial":"superficial"}${v?" *":""}</option>`).join("")}</optgroup>`).join("");
  return `<div class="picker"><label for="blockSel">Find your block (Table 2)</label>
    <select id="blockSel"><option value="">— choose a block to set the category —</option>${opts}</select>
    <small>* column assignment unclear in the extracted PDF text — verify against the printed Table 2. The list is neither definitive nor absolute; institutional categorisation may differ.</small></div>`;
}

/* ---------- planner ---------- */
function plannerDrugOptions(){
  const src = state.plan.mode==="regional" ? DATA.regional.drugs : DATA.surgical.drugs;
  const out = [];
  src.forEach((d,di)=>d.doses.forEach((x,xi)=>{ if(x.hours) out.push({ id:`${di}.${xi}`, label:`${d.name} — ${x.label}`, drug:d, dose:x }); }));
  return out;
}
function fmt(dt){ return dt.toLocaleString("en-GB",{weekday:"short", day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"}); }
function hrs(h){ return h>=48 && h%24===0 ? `${h/24} days` : `${h} h`; }
function computePlan(){
  const P = state.plan;
  const opts = plannerDrugOptions();
  const chosen = P.drugs.map(id=>opts.find(o=>o.id===id)).filter(Boolean);
  if(!chosen.length) return `<p class="note">Select one or more drugs. With a combination, the longest interval applies (R19).</p>`;
  const when = P.when ? new Date(P.when) : null;
  let rows = "", maxBefore = 0, maxAfter = 0, flags = [];
  for(const c of chosen){
    const h = c.dose.hours;
    let before = h.before, lab = !!h.labRequired, note = "";
    if(state.renal==="mod" && h.mod!=null) { before = h.mod; note = RENAL_LABEL.mod; }
    if(state.renal==="severe" && h.severe!=null) { before = h.severe; note = RENAL_LABEL.severe; }
    if((state.renal==="mod" && h.modLab) || (state.renal==="severe" && h.severeLab)) { lab = true; note = RENAL_LABEL[state.renal]+" — laboratory target required, the fixed interval does not apply"; }
    if(P.mode==="regional" && state.block==="low" && !h.notRecommended){ before = 0; note = "Superficial block — zero interval if within/below individual therapeutic range (Table 4)"; }
    if(h.continue) note = "Continue — do not interrupt";
    if(h.notRecommended) flags.push(`${c.drug.name}: neuraxial / deep procedures not recommended (1C).`);
    if(P.mode==="regional" && state.block==="high" && /P2Y12/.test(c.drug.name)) flags.push("P2Y12 inhibitor: deep blocks are contraindicated (R18) — interval shown is for neuraxial after withdrawal.");
    let after = h.after; if(P.mode==="regional" && state.block==="low") after = 0;
    if(P.catheter && P.mode==="regional" && (/VKA|DOAC|Xa|Dabigatran|high dose|P2Y12/i.test(c.drug.name+c.dose.label))) flags.push(`${c.drug.name}: not to be given with a neuraxial catheter in situ — next dose only after catheter removal (bridge with low-dose LMWH/UFH).`);
    maxBefore = Math.max(maxBefore, before||0); if(after!=null) maxAfter = Math.max(maxAfter, after);
    const range = h.beforeMax ? ` (up to ${hrs(h.beforeMax)})` : "";
    rows += `<tr><td><strong>${esc(c.drug.name)}</strong><br><small>${esc(c.dose.label)}</small></td>
      <td>${h.continue?"continue":hrs(before)+range}${lab?" <span class=\"grade\">lab target</span>":""}${h.dayBefore?"<br><small>last dose the day before</small>":""}<br><small>${esc(note)}</small></td>
      <td>${after==null?"per guidance":(after===0?"routine / no delay":"≥ "+hrs(after))}${h.afterMax?` – ${hrs(h.afterMax)}`:""}${h.afterAlt?`<br><small>${esc(h.afterAlt)}</small>`:""}</td></tr>`;
  }
  let summary = "";
  if(when){
    const last = new Date(when.getTime() - maxBefore*3600e3);
    const next = new Date(when.getTime() + maxAfter*3600e3);
    summary = `<div class="plan-out">
      <div class="po"><div class="lbl">Last dose no later than</div><div class="big">${fmt(last)}</div><small>${hrs(maxBefore)} before the procedure${chosen.length>1?" (longest interval of the combination)":""}</small></div>
      <div class="po mid"><div class="lbl">Procedure</div><div class="big">${fmt(when)}</div></div>
      <div class="po"><div class="lbl">Earliest next dose</div><div class="big">${maxAfter===0?"routine time":fmt(next)}</div><small>${maxAfter===0?"":hrs(maxAfter)+" after, once haemostasis is secured"}</small></div>
    </div>`;
  } else summary = `<p class="note">Enter the procedure date and time to get calendar times.</p>`;
  return summary +
    `<div class="scroll"><table class="ref"><tr><th>Drug</th><th>Last dose → procedure</th><th>Procedure → next dose</th></tr>${rows}</table></div>` +
    (flags.length?`<div class="warn">${flags.map(f=>`<p>⚠ ${f}</p>`).join("")}</div>`:"") +
    `<p class="note">Intervals are minimums from the guideline tables; laboratory targets, bloody tap, renal function and thrombotic risk may lengthen or shorten them. ${P.mode==="regional"?"Applies equally to needle insertion, catheter insertion and catheter removal (R36).":"Resumption requires adequate surgical haemostasis."}</p>
     <button class="btn" id="copyPlan">Copy summary</button>`;
}
function renderPlanner(){
  const P = state.plan;
  const opts = plannerDrugOptions();
  $("#panel-planner").innerHTML = `
    <div class="plan-form">
      <div class="chips" style="padding-top:0">
        <span class="lbl">Scenario</span>
        <button data-pk="mode" data-v="regional" aria-pressed="${P.mode==="regional"}">Neuraxial / nerve block</button>
        <button data-pk="mode" data-v="surgical" aria-pressed="${P.mode==="surgical"}">Surgery</button>
      </div>
      ${P.mode==="regional" ? `<div class="chips" style="padding-top:0"><span class="lbl">Block</span>
        <button data-pk="block" data-v="high" aria-pressed="${state.block==="high"}">Neuraxial / deep</button>
        <button data-pk="block" data-v="low" aria-pressed="${state.block==="low"}">Superficial</button>
        <span class="sep"></span><button data-pk="catheter" data-v="toggle" aria-pressed="${P.catheter}">Catheter will stay in</button></div>`
      : `<div class="chips" style="padding-top:0"><span class="lbl">Procedure risk</span>
        <button data-pk="proc" data-v="low" aria-pressed="${state.proc==="low"}">Low bleeding</button>
        <button data-pk="proc" data-v="high" aria-pressed="${state.proc==="high"}">Intermediate / high</button></div>`}
      <div class="chips" style="padding-top:0"><span class="lbl">CrCl</span>
        <button data-pk="renal" data-v="normal" aria-pressed="${state.renal==="normal"}">&gt; 50</button>
        <button data-pk="renal" data-v="mod" aria-pressed="${state.renal==="mod"}">30–50</button>
        <button data-pk="renal" data-v="severe" aria-pressed="${state.renal==="severe"}">&lt; 30</button></div>
      <label class="fl">Drug(s) — tap to add
        <div class="drugchips">${opts.filter(o => P.mode!=="surgical" || (state.proc==="low" ? !/intermediate|withdrawal|INR/i.test(o.dose.label) : !/low-bleeding/i.test(o.dose.label))).map(o=>`<button data-drug="${o.id}" aria-pressed="${P.drugs.includes(o.id)}">${esc(o.label)}</button>`).join("")}</div>
      </label>
      <label class="fl">Procedure date &amp; time <input type="datetime-local" id="planWhen" value="${esc(P.when)}"></label>
    </div>
    <div id="planOut">${computePlan()}</div>`;
  $("#panel-planner").querySelectorAll("[data-pk]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.pk, v=b.dataset.v;
    if(k==="mode"){ P.mode=v; P.drugs=[]; } else if(k==="catheter"){ P.catheter=!P.catheter; } else state[k]=v;
    syncChips(); renderPlanner();
  }));
  $("#panel-planner").querySelectorAll("[data-drug]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.drug; P.drugs = P.drugs.includes(id) ? P.drugs.filter(x=>x!==id) : [...P.drugs,id]; renderPlanner();
  }));
  $("#planWhen").addEventListener("change", e=>{ P.when=e.target.value; $("#planOut").innerHTML=computePlan(); bindCopy(); });
  bindCopy();
}
function bindCopy(){
  const b=$("#copyPlan"); if(!b) return;
  b.addEventListener("click", async ()=>{
    const t = $("#planOut").innerText.replace(/\n{3,}/g,"\n\n");
    try{ if(navigator.share){ await navigator.share({title:"Antithrombotic timing", text:t}); } else { await navigator.clipboard.writeText(t); b.textContent="Copied"; } }catch(e){}
  });
}

/* ---------- main render ---------- */
function syncChips(){
  document.querySelectorAll('.top .chips button[data-k]').forEach(b=>{
    const k=b.dataset.k; b.setAttribute("aria-pressed", String(state[k]===b.dataset.v));
  });
}
function render(){
  for(const t of ["regional","surgical","other","planner","ref"]){
    $(`#tab-${t}`).setAttribute("aria-selected", state.tab===t);
    $(`#panel-${t}`).classList.toggle("hidden", state.tab!==t);
  }
  $("#chips-regional").classList.toggle("hidden", state.tab!=="regional");
  $("#chips-surgical").classList.toggle("hidden", state.tab!=="surgical");
  $("#searchBox").classList.toggle("hidden", state.tab==="ref" || state.tab==="planner");
  $("#srcLabel").textContent = state.tab==="surgical" ? "ESAIC 2023" : state.tab==="other" ? "ESC 2022 · DGAI 2024 · ESAIC 2018" : state.tab==="ref" ? "ESAIC/ESRA 2022 · Table 1" : state.tab==="planner" ? "Planner" : "ESAIC/ESRA 2022";
  $("#banner").textContent = DATA.disclaimer;
  syncChips();

  if(state.tab==="regional"){
    const R = DATA.regional;
    if(state.block==="high"){
      $("#panel-regional").innerHTML = blockPicker() + rules(R.generalHigh, "Key rules for neuraxial & deep blocks") + renderList(R.drugs, d=>d.doses[0]);
    } else {
      $("#panel-regional").innerHTML = blockPicker() + rules(R.generalLow, "Key rules for superficial blocks") +
        `<div class="scroll"><table class="ref">
           <tr><th>Drug</th><th>Last dose → block</th><th>Block → next dose</th><th>Lab target</th></tr>
           <tr><td>DOACs (any dose), LMWH low, UFH low, fondaparinux low, aspirin low</td><td><strong style="color:var(--ok)">Zero</strong></td><td>Routinely prescribed next time point</td><td>No testing (consider a level if accumulation suspected)</td></tr>
           <tr><td>VKA, LMWH high, UFH high, aspirin high, P2Y12 inhibitors, drug combinations</td><td><strong style="color:var(--ok)">Zero</strong> if within or below the patient's individual therapeutic range</td><td>Routinely prescribed next time point</td><td>Within or below the individual therapeutic range (not defined for DOACs)</td></tr>
         </table></div>`;
    }
    const sel = $("#blockSel"); if(sel) sel.addEventListener("change", e=>{
      const [n,c] = e.target.value.split("|"); state.blockName = n||""; if(c){ state.block = c==="deep"?"high":"low"; } render();
    });
  }
  if(state.tab==="surgical"){
    const S = DATA.surgical;
    $("#panel-surgical").innerHTML = rules(S.general, "Key rules for surgical interruption") +
      `<p class="note">Summary shows the ${state.proc==="low"?"low":"intermediate / high"} bleeding-risk row. Open a drug for every scenario.</p>` +
      renderList(S.drugs, pickSurgicalRow);
  }
  if(state.tab==="other"){
    const O = DATA.other;
    $("#panel-other").innerHTML = rules(O.general, "Key rules for other chronic medication") +
      `<p class="note">Rows marked <span class="grade warnb">verify</span> are universal practice but were not checked against an individual guideline record for this build. Non-European sources (UK, US) are used where no ESAIC/ESC/DGAI recommendation exists and are named in the grade. Grades: ESC class/level; DGAI A (soll) / B (sollte) / 0 (kann).</p>` +
      renderList(O.drugs, d=>d.doses[0]);
  }
  if(state.tab==="planner") renderPlanner();
  if(state.tab==="ref"){
    const T = DATA.doseTable;
    $("#panel-ref").innerHTML =
      `<p class="note">${T.note}</p>
       <div class="scroll"><table class="ref">
         <tr><th>Indication</th><th>Category</th><th>Rivaroxaban</th><th>Apixaban</th><th>Edoxaban</th><th>Dabigatran</th></tr>
         ${T.rows.map(r=>`<tr><td>${r[0]}</td><td><strong>${r[1]}</strong></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join("")}
       </table></div>
       <h3 style="margin-top:24px;font-size:1rem">Other dose thresholds</h3>
       <ul class="note">
         <li>LMWH: low ≤ 50 IU anti-Xa/kg/day (enoxaparin 40 mg, dalteparin 5000 IU, nadroparin 5700 IU, tinzaparin 4500 IU per day); high = above.</li>
         <li>UFH: low ≤ 200 IU/kg/day SC or ≤ 100 IU/kg/day IV; high = above.</li>
         <li>Fondaparinux: low 2.5 mg/day; high 5–10 mg/day.</li>
         <li>Aspirin: low &lt; 200 mg/day; high ≥ 200 mg/day.</li>
       </ul>`;
  }
  $("#footer").innerHTML = `<p><strong>Sources</strong></p>` +
    DATA.sources.map(s=>`<p>${esc(s.key)} — ${esc(s.text)} <a href="${s.url}" target="_blank" rel="noopener">link</a></p>`).join("") +
    `<p>Data version ${esc(DATA.version)} · ${esc(DATA.editor)}${DATA.issuesUrl?` · <a href="${DATA.issuesUrl}" target="_blank" rel="noopener">Report an error</a>`:""}</p>`;
}

document.querySelectorAll(".top .chips").forEach(c=>c.addEventListener("click", e=>{
  const b = e.target.closest("button[data-k]"); if(!b) return;
  state[b.dataset.k] = b.dataset.v; if(b.dataset.k==="block") state.blockName=""; render();
}));
document.querySelectorAll('[role="tab"]').forEach(t=>t.addEventListener("click",()=>{ state.tab = t.id.replace("tab-",""); render(); window.scrollTo({top:0}); }));
const qi = $("#q");
qi.addEventListener("input", e=>{ state.q = e.target.value.trim().toLowerCase(); $("#searchBox").classList.toggle("has", !!state.q); render(); });
$("#clear").addEventListener("click", ()=>{ qi.value=""; state.q=""; $("#searchBox").classList.remove("has"); render(); qi.focus(); });
render();
if("serviceWorker" in navigator){
  const bar = document.getElementById("updBar");
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => { const w = reg.installing; w && w.addEventListener("statechange", () => { if(w.state==="installed" && navigator.serviceWorker.controller) bar.classList.add("on"); }); });
    const check = () => reg.update().catch(()=>{});
    check(); document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible") check(); });
    setInterval(check, 30*60*1000);
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(!reloaded){ reloaded=true; location.reload(); } });
}
</script>
</body>
</html>
